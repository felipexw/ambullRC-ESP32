<svg width="720" height="540" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="720" height="540" fill="#ffffff"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold">Schematic — ESP32 RC Car (final)</text>

<!-- Battery 2x18650 (no built-in switch) -->
<rect x="40" y="50" width="140" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="110" y="70" text-anchor="middle" font-weight="bold" font-size="13">2x 18650 (series)</text>
<text x="110" y="88" text-anchor="middle" font-size="11">7.4-8.4V</text>
<text x="184" y="68" font-size="12">+</text>

<!-- External switch -->
<rect x="210" y="60" width="110" height="40" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
<text x="265" y="84" text-anchor="middle" font-size="12">ON/OFF switch</text>
<path d="M180 80 L210 80" fill="none" stroke="#555" stroke-width="1.5"/>

<!-- Branch to LM2596 #2 and LM2596 #1 -->
<path d="M320 80 L320 110 L170 110 L170 170" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M320 80 L320 110 L490 110 L490 170" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="115" y="163" font-size="11">IN+</text>
<text x="497" y="163" font-size="11">IN+</text>

<!-- LM2596 #2 (ESP32 + Servo) -->
<rect x="100" y="170" width="140" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="190" text-anchor="middle" font-weight="bold" font-size="13">LM2596 #2</text>
<text x="170" y="208" text-anchor="middle" font-size="11">set to 5V</text>

<!-- LM2596 #1 (Motor) -->
<rect x="420" y="170" width="140" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="490" y="190" text-anchor="middle" font-weight="bold" font-size="13">LM2596 #1</text>
<text x="490" y="208" text-anchor="middle" font-size="11">set to 6V</text>

<!-- LM2596 #2 output to ESP32 VIN and Servo VCC -->
<path d="M170 230 L170 260 L125 260 L125 290" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M170 230 L170 260 L265 260 L265 290" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="106" y="236" font-size="11">OUT+ 5V (VCC-B)</text>
<text x="280" y="265" font-size="11">C2 100-220uF</text>

<!-- LED1 power indicator (on VCC-B line) -->
<path d="M170 245 L250 245" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="256" cy="245" r="5" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
<text x="266" y="248" font-size="10">LED1 power (R 220-330Ω) → GND</text>

<!-- GPIO signal wires (dashed) -->
<path d="M80 290 L80 140 L370 140 L370 280 L420 280" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="225" y="134" text-anchor="middle" font-size="11">GPIO18 → B-IA</text>

<path d="M95 290 L95 130 L380 130 L380 310 L420 310" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="237" y="123" text-anchor="middle" font-size="11">GPIO19 → B-IB</text>

<line x1="190" y1="325" x2="200" y2="325" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M195 310 L195 323" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2 2"/>
<text x="195" y="302" text-anchor="middle" font-size="11">GPIO13 signal</text>

<!-- LED2 Bluetooth indicator -->
<path d="M190 340 L235 340" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="241" cy="340" r="5" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1"/>
<text x="251" y="343" font-size="10">GPIO4 → LED2 Bluetooth (R 220Ω)</text>

<!-- ESP32 -->
<rect x="60" y="290" width="130" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="125" y="318" text-anchor="middle" font-weight="bold" font-size="13">ESP32</text>
<text x="125" y="336" text-anchor="middle" font-size="11">VIN</text>
<text x="130" y="367" font-size="11">GND</text>

<!-- Servo -->
<rect x="200" y="290" width="130" height="70" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
<text x="265" y="318" text-anchor="middle" font-weight="bold" font-size="13">Servo SG90</text>
<text x="265" y="336" text-anchor="middle" font-size="11">VCC (red)</text>
<text x="270" y="367" font-size="11">GND (black)</text>

<!-- LM2596 #1 output to L9110S VCC -->
<line x1="490" y1="230" x2="490" y2="270" stroke="#555" stroke-width="1.5"/>
<text x="497" y="253" font-size="11">OUT+ 6V (VCC-A)</text>

<!-- L9110S (channel B in use — channel A damaged) -->
<rect x="420" y="270" width="140" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="490" y="290" text-anchor="middle" font-weight="bold" font-size="13">L9110S</text>
<text x="490" y="308" text-anchor="middle" font-size="10">channel B (channel A damaged)</text>
<text x="502" y="345" font-size="11">C1 1000uF</text>

<!-- L9110S output to Motor -->
<line x1="480" y1="330" x2="480" y2="370" stroke="#555" stroke-width="1.5"/>
<line x1="500" y1="330" x2="500" y2="370" stroke="#555" stroke-width="1.5"/>
<text x="454" y="325" font-size="11">MOTOR B+</text>
<text x="502" y="325" font-size="11">B-</text>

<!-- Motor -->
<rect x="420" y="370" width="140" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="490" y="398" text-anchor="middle" font-weight="bold" font-size="13">DC Motor</text>
<text x="490" y="416" text-anchor="middle" font-size="11">3-6V</text>

<!-- GND wires -->
<line x1="50" y1="110" x2="50" y2="480" stroke="#555" stroke-width="1.5"/>
<line x1="125" y1="360" x2="125" y2="480" stroke="#555" stroke-width="1.5"/>
<line x1="265" y1="360" x2="265" y2="480" stroke="#555" stroke-width="1.5"/>
<path d="M230 230 L230 250 L370 250 L370 480" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M420 200 L390 200 L390 480" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M420 315 L405 315 L405 480" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="235" y="236" font-size="11">GND</text>
<text x="368" y="194" font-size="11">GND</text>

<!-- GND rail -->
<line x1="40" y1="480" x2="560" y2="480" stroke="#555" stroke-width="1.5"/>
<line x1="270" y1="490" x2="300" y2="490" stroke="#555" stroke-width="1.5"/>
<line x1="277" y1="497" x2="293" y2="497" stroke="#555" stroke-width="1.5"/>
<line x1="284" y1="504" x2="286" y2="504" stroke="#555" stroke-width="1.5"/>
<text x="310" y="497" font-size="11">Common GND (all components)</text>

<text x="360" y="525" text-anchor="middle" font-size="10" fill="#666">VCC-A (6V, motor) and VCC-B (5V, ESP32/servo) remain on isolated breadboard rails; only GND is bridged.</text>
</svg>
